<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Reset Dashboard Password</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f4f5f7; display: flex; justify-content: center; padding: 40px 20px; }
    .card { background: white; border-radius: 10px; padding: 32px; max-width: 420px; width: 100%; box-shadow: 0 1px 4px rgba(0,0,0,0.1); }
    h1 { font-size: 20px; margin-top: 0; }
    .subtitle { font-size: 13px; color: #666; margin-bottom: 10px; }
    label { display: block; font-size: 13px; color: #555; margin-top: 14px; margin-bottom: 4px; }
    input { width: 100%; padding: 8px 10px; box-sizing: border-box; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; }
    button { width: 100%; margin-top: 20px; padding: 10px; background: #2c3e50; color: white; border: none; border-radius: 6px; font-size: 15px; cursor: pointer; }
    button:hover { background: #34495e; }
    #result { display: none; margin-top: 20px; padding: 16px; background: #eafaf1; border-radius: 6px; font-size: 13px; }
    .error { color: #c0392b; font-size: 13px; margin-top: 10px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Reset Dashboard Password</h1>
    <div class="subtitle">You'll need your dashboard username and your recovery key (shown to you once, at signup or when generated from the dashboard).</div>
    <form id="reset-form">
      <label>Dashboard username</label>
      <input type="text" id="dashboard_username" required>

      <label>Recovery key</label>
      <input type="text" id="recovery_key" required>

      <label>New password</label>
      <input type="password" id="new_password" required>

      <button type="submit">Reset Password</button>
      <div id="error" class="error"></div>
    </form>

    <div id="result">
      <strong>Password reset successfully.</strong>
      <div style="margin-top:10px;">You can now <a href="/dashboard">log into your dashboard</a> with your new password.</div>
    </div>
  </div>

  <script>
    document.getElementById("reset-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const errorEl = document.getElementById("error");
      errorEl.textContent = "";

      const payload = {
        dashboard_username: document.getElementById("dashboard_username").value,
        recovery_key: document.getElementById("recovery_key").value,
        new_password: document.getElementById("new_password").value,
      };

      try {
        const res = await fetch("/companies/reset-password", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
        const data = await res.json();

        if (!res.ok) {
          errorEl.textContent = data.detail || "Reset failed.";
          return;
        }

        document.getElementById("reset-form").style.display = "none";
        document.getElementById("result").style.display = "block";
      } catch (err) {
        errorEl.textContent = "Could not reach the server. Try again.";
      }
    });
  </script>
</body>
</html>
